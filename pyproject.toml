[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svara-voice"
dynamic = ["version"]
description = "Python SDK for Svara — Kenpath Labs' multilingual text-to-speech API (80 languages, streaming, telephony)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Kenpath Labs" }]
keywords = ["tts", "text-to-speech", "svara", "kenpath", "speech", "voice", "multilingual", "livekit", "telephony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
# Drop Svara into a LiveKit Agents pipeline: `from svara.livekit import TTS`.
livekit = ["livekit-agents>=1.6"]
# Drop Svara into a Pipecat pipeline: `from svara.pipecat import SvaraTTSService`.
# 0.0.105 introduced the Settings API and run_tts(text, context_id) the service targets.
pipecat = ["pipecat-ai>=0.0.105"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
svara = "svara._cli:main"

[project.urls]
Homepage = "https://kenpathlabs.com"
Documentation = "https://docs.kenpathlabs.com"
Source = "https://github.com/kenpath-labs/svara-python"
Changelog = "https://github.com/kenpath-labs/svara-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/kenpath-labs/svara-python/issues"

[tool.hatch.version]
path = "src/svara/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/svara"]

# The sdist is what `pip install svara-voice` falls back to when no wheel
# matches, and hatchling otherwise sweeps up everything git does not ignore.
# A local build once picked up a 200 MB test venv. List what ships instead.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/svara",
    "tests",
    "docs",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "MEASUREMENTS.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# No "UP" (pyupgrade): we support Python 3.9, so typing.Optional/Dict are intentional.
select = ["E", "F", "I", "W"]
# E402: several modules import lazily after an availability check (svara.livekit,
# svara.pipecat) or after load_dotenv — that ordering is intentional.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
