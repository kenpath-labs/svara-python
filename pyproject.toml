[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svara"
dynamic = ["version"]
description = "Python SDK for Svara — Kenpath Labs' multilingual text-to-speech API (80 languages, streaming, voice cloning, telephony)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Kenpath Labs" }]
keywords = ["tts", "text-to-speech", "svara", "kenpath", "speech", "voice", "multilingual", "livekit", "telephony"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
# Drop Svara into a LiveKit Agents pipeline: `from svara.livekit import TTS`.
livekit = ["livekit-agents>=1.6"]
# Reserved for the Pipecat frame-processor integration (see docs/deployment/websocket-media.md).
pipecat = ["pipecat-ai>=0.0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
svara = "svara._cli:main"

[project.urls]
Homepage = "https://kenpathlabs.com"
Documentation = "https://docs.kenpathlabs.com"
Source = "https://github.com/kenpath-labs/svara-python"

[tool.hatch.version]
path = "src/svara/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/svara"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# No "UP" (pyupgrade): we support Python 3.9, so typing.Optional/Dict are intentional.
select = ["E", "F", "I", "W"]
# E402: several modules import lazily after an availability check (svara.livekit,
# svara.pipecat) or after load_dotenv — that ordering is intentional.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
