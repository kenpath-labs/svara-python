name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Unit tests (no network)
        run: pytest tests/test_unit.py tests/test_fixes.py tests/test_production.py -q

  # The framework integrations import their host framework; keep them on the
  # versions the extras resolve to today so a breaking release upstream shows
  # up here rather than in a customer's agent.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with both extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,livekit,pipecat]"
      - name: Plugin tests
        run: pytest tests/test_livekit_plugin.py tests/test_pipecat_service.py -q

  # Live tests need the SVARA_API_KEY repository secret. `secrets` cannot be
  # read in a step-level `if`, so it is lifted into the job environment first.
  integration:
    runs-on: ubuntu-latest
    env:
      SVARA_API_KEY: ${{ secrets.SVARA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        if: ${{ env.SVARA_API_KEY != '' }}
        run: pytest tests/test_integration.py -q
      - name: Skipped (no SVARA_API_KEY secret)
        if: ${{ env.SVARA_API_KEY == '' }}
        run: echo "SVARA_API_KEY secret not set; live tests skipped"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: The sdist must not carry a venv
        run: |
          tar tzf dist/*.tar.gz | grep -E '/(\.?venv|site-packages)/' && exit 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
